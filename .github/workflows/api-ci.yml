name: api-ci

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - ".github/workflows/api-ci.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - ".github/workflows/api-ci.yml"

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: latest

      - name: Set up Python
        run: uv python install 3.12

      - name: Install deps
        working-directory: apps/api
        run: uv sync --dev

      - name: Ruff lint
        working-directory: apps/api
        run: uv run ruff check src/

      - name: Mypy strict
        working-directory: apps/api
        run: uv run mypy src/

      - name: Pytest (unit, no eval)
        working-directory: apps/api
        run: uv run pytest tests/ -v
