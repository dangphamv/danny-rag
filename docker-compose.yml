# Local data plane for danny_rag.
#
# Brings up:
#   - qdrant         (vector store, port 6333)
#   - postgres       (shared by Langfuse + LangGraph checkpointer, port 5432)
#   - clickhouse     (Langfuse v3 traces, localhost only)
#   - redis          (Langfuse v3 queue + cache, localhost only)
#   - minio          (Langfuse v3 blob storage, port 9090)
#   - langfuse-web   (Langfuse UI + API, port 3001 — remapped to avoid Next.js 3000)
#   - langfuse-worker (Langfuse async event processor, localhost only)
#
# Note: BRD-01 §3.6 / §7.2 BRD.01.3205 was originally written assuming Langfuse
# v2's single-binary architecture. v2 is deprecated as of 2026; v3 requires the
# additional services above. The Postgres-sharing trade-off (BRD §10 R3) still
# applies — both Langfuse metadata and the LangGraph checkpointer use this
# instance. ClickHouse holds the actual traces.
#
# Local-dev credentials are intentional and committed. NEVER reuse for prod.

services:
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "6333:6333"  # REST + UI
      - "6334:6334"  # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      TZ: UTC
      PGTZ: UTC
    ports:
      # Host port 5433 to avoid a local postgres instance on 5432.
      # Container-internal port stays 5432 — Langfuse connects via docker DNS.
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    restart: unless-stopped
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      --requirepass localredis
      --maxmemory-policy noeviction
    ports:
      # Host port 6380 to avoid conflict with a local Homebrew redis on 6379.
      # Container-internal port stays 6379 — Langfuse connects via docker DNS
      # (REDIS_HOST=redis REDIS_PORT=6379) so the remap is host-side only.
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "localredis", "ping"]
      interval: 3s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: miniosecret
    ports:
      - "9090:9000"   # S3 API
      - "127.0.0.1:9091:9001"  # console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  langfuse-worker:
    image: langfuse/langfuse-worker:3
    restart: unless-stopped
    depends_on: &langfuse_deps
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "127.0.0.1:3030:3030"
    environment: &langfuse_env
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/postgres
      SALT: dev-salt-not-for-prod
      ENCRYPTION_KEY: 15fb5fa803dd5ebb8ee8d5a3fa0aecede7f3daf88485b7d34d5ccb212a684537
      TELEMETRY_ENABLED: "false"
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "false"
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: miniosecret
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: miniosecret
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://localhost:9090
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_AUTH: localredis
      REDIS_TLS_ENABLED: "false"

  langfuse-web:
    image: langfuse/langfuse:3
    restart: unless-stopped
    depends_on: *langfuse_deps
    ports:
      # Host port 3002 to avoid a node dev server already on :3001.
      # Container-internal port stays 3000.
      - "3002:3000"
    environment:
      <<: *langfuse_env
      NEXTAUTH_URL: http://localhost:3002
      NEXTAUTH_SECRET: dev-nextauth-secret-32-chars-minimum-len
      LANGFUSE_INIT_ORG_ID: dev
      LANGFUSE_INIT_ORG_NAME: Local Dev
      LANGFUSE_INIT_PROJECT_ID: danny-rag
      LANGFUSE_INIT_PROJECT_NAME: danny_rag
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: pk-lf-dev-public
      LANGFUSE_INIT_PROJECT_SECRET_KEY: sk-lf-dev-secret
      LANGFUSE_INIT_USER_EMAIL: dev@local.dev
      LANGFUSE_INIT_USER_NAME: Local Dev
      LANGFUSE_INIT_USER_PASSWORD: dev-password-change-me

volumes:
  qdrant_data:
  postgres_data:
  clickhouse_data:
  clickhouse_logs:
  redis_data:
  minio_data:
